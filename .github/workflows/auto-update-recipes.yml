name: Auto Update Recipes

on:
  schedule:
    - cron: '0 0 * * *' # Midnight every day
  workflow_dispatch: # Allows manual trigger

jobs:
  update-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run update-recipes script
        run: node scripts/update-recipes.cjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/recipes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update recipes.json" && git push)

